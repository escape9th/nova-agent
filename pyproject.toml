[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-agent"
version = "0.7.0"
description = "A minimal, readable, from-scratch AI agent framework with tool-calling, memory, planning and multi-agent orchestration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "escape9th" }]
keywords = [
    "ai", "agent", "llm", "react", "tool-calling", "function-calling",
    "rag", "multi-agent", "planning", "memory", "retrieval", "streaming",
    "openai", "qwen", "deepseek", "ollama", "openai-compatible",
    "智能体", "AI Agent", "大模型", "大语言模型", "工具调用", "多智能体",
    "检索增强生成", "向量检索", "记忆", "提示词", "RAG", "ReAct", "通义千问",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.40",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
nova = "nova.__main__:main"

[project.urls]
Homepage = "https://github.com/escape9th/nova-agent"
Issues = "https://github.com/escape9th/nova-agent/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
